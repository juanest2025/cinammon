[/]
custom-list=['custom0', 'custom1', 'custom2', 'custom3', 'custom4', 'custom5', 'custom6', 'custom7', 'custom8', 'custom9']

[custom-keybindings/custom0]
binding=['<Shift><Alt>i']
command='/home/juanes/.config/rofi/sitios/sites.sh'
name='rofi sites'

[custom-keybindings/custom1]
binding=['<Alt>m']
command='/home/juanes/.config/rofi/sitios/webs.sh'
name='rofi webs'

[custom-keybindings/custom2]
binding=['<Alt>space']
command='/home/juanes/.config/rofi/launcher.sh'
name='rofi launcher'

[custom-keybindings/custom3]
binding=['<Super>Return']
command='kitty'
name='kitty'

[custom-keybindings/custom4]
binding=['<Alt>ntilde']
command='brave-browser'
name='brave browser'

[custom-keybindings/custom5]
binding=['<Alt>l']
command='google-chrome'
name='google chrome'

[custom-keybindings/custom6]
binding=['<Super>i']
command="kitty -e sh -c 'file=$(fzf --preview=\"bat --theme=gruvbox-dark --color=always {}\"); [ -n \"$file\" ] && nvim \"$file\"'"
name='fzf'

[custom-keybindings/custom7]
binding=['<Super>w']
command='brave-browser --app=https://web.whatsapp.com\n'
name='whatsapp'

[custom-keybindings/custom8]
binding=['<Super>t']
command='flatpak run org.telegram.desktop\n'
name='telegram'

[custom-keybindings/custom9]
binding=['<Primary><Shift>p']
command='/home/juanes/.config/rofi/sitios/edit.sh'
name='editar rofi scripts'

[wm]
activate-window-menu=@as []
close=['<Alt>F4', '<Shift><Alt>e', '<Super>q']
toggle-fullscreen=['<Super>f']
